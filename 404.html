<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found - Thankful For You</title>
    <style>
      :root {
        color: #1c2024;
        background: #f3f5f7;
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
        padding: 28px;
        border: 1px solid #d8dde3;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 36px rgba(28, 32, 36, 0.08);
      }

      p {
        margin: 0 0 14px;
        color: #66727f;
        line-height: 1.45;
      }

      .kicker {
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 1.7rem;
        line-height: 1.15;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 16px;
        border-radius: 999px;
        color: #ffffff;
        background: #007b78;
        font-weight: 800;
        text-decoration: none;
      }

      a:hover {
        background: #006764;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>Page not found</h1>
      <p>This link does not match a page in Thankful For You.</p>
      <a href="/orders">Open Orders</a>
    </main>
  </body>
</html>
