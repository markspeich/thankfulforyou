<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badge Reel Text Layout Tool</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="production-workspace">
        <aside class="orders-panel" aria-label="Design navigation">
          <div class="queue-header">
            <h1>Design Queue</h1>
            <details class="queue-tools-menu">
              <summary class="queue-tools-toggle" aria-label="Queue tools"></summary>
              <div class="queue-tools-popover">
                <div class="queue-tools-actions" role="menu" aria-label="Queue actions">
                  <div class="queue-tools-group" aria-label="Create queue items">
                    <p class="queue-tools-heading">Create</p>
                    <button id="addOrderButton" class="queue-tool-button" type="button">
                      <span class="queue-tool-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                          <path d="M12 5v14M5 12h14" />
                        </svg>
                      </span>
                      <span class="queue-tool-label">Add Design</span>
                    </button>
                    <button
                      id="importClipboardButton"
                      class="queue-tool-button"
                      type="button"
                      title="Import Etsy clipboard data copied from the browser helper."
                    >
                      <span class="queue-tool-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                          <path d="M9 5h6M9 3h6a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1V5a2 2 0 0 1 2-2Z" />
                          <path d="M12 10v6M9.5 13.5 12 16l2.5-2.5" />
                        </svg>
                      </span>
                      <span class="queue-tool-label">Import Clipboard</span>
                    </button>
                  </div>

                  <div class="queue-tools-group" aria-label="Batch output actions">
                    <p class="queue-tools-heading">Batch Output</p>
                    <button id="copyCompletedButton" class="queue-tool-button" type="button">
                      <span class="queue-tool-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                          <rect x="9" y="9" width="10" height="10" rx="2" />
                          <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
                        </svg>
                      </span>
                      <span class="queue-tool-label">Copy All Designs</span>
                    </button>
                    <button id="exportCompletedButton" class="queue-tool-button" type="button">
                      <span class="queue-tool-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                          <path d="M12 4v10M8.5 10.5 12 14l3.5-3.5" />
                          <path d="M5 16v1a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-1" />
                        </svg>
                      </span>
                      <span class="queue-tool-label">Export All Designs</span>
                    </button>
                  </div>

                  <div class="queue-tools-group queue-tools-group-danger" aria-label="Danger zone">
                    <p class="queue-tools-heading">Danger Zone</p>
                    <button id="clearQueueButton" class="queue-tool-button" type="button">
                      <span class="queue-tool-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                          <path d="M4 7h16" />
                          <path d="M9 4h6" />
                          <path d="M7 7l1 11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-11" />
                          <path d="M10 11v5M14 11v5" />
                        </svg>
                      </span>
                      <span class="queue-tool-label">Clear Batch</span>
                    </button>
                  </div>
                </div>
                <div id="queueSyncStatus" class="status-card" aria-live="polite" hidden>
                  <strong id="queueSyncStatusLabel"></strong>
                  <span id="queueSyncStatusDetail"></span>
                </div>
              </div>
            </details>
          </div>
          <p id="importStatus" class="note queue-alert" role="status" aria-live="polite" hidden></p>

          <div class="order-stats" aria-label="Design status summary">
            <div>
              <span>Complete</span>
              <strong id="completeCountOutput">0</strong>
            </div>
            <div>
              <span>In Progress</span>
              <strong id="progressCountOutput">0</strong>
            </div>
          </div>
          <output id="notStartedCountOutput" class="visually-hidden">0</output>

          <section class="order-queue" aria-label="Design queue">
            <div class="section-heading">Queue <output id="orderCountOutput">0</output></div>
            <div class="order-queue-card">
              <label class="search-field">
                <span class="visually-hidden">Search designs</span>
                <input id="orderSearchInput" type="search" autocomplete="off" placeholder="Search designs...">
              </label>
              <div id="orderList" class="order-list" role="list"></div>
            </div>
          </section>
        </aside>

        <section class="editor-panel is-hidden" aria-label="Selected design editor">
          <header class="editor-header">
            <div>
              <h2 id="activeOrderName">No design selected</h2>
              <p id="activeOrderMeta" class="editor-meta">Add or import a design to start editing.</p>
            </div>
            <div class="editor-actions">
              <button id="captureButton" class="editor-action-button" type="button">
                <span class="editor-action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M6 12.5 10 16.5 18 8.5" />
                  </svg>
                </span>
                <span class="editor-action-label">Complete</span>
              </button>
              <button id="completeNextButton" class="editor-action-button" type="button">
                <span class="editor-action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M5.5 12.5 9.5 16.5 14 12" />
                    <path d="M13 8.5h5v5" />
                    <path d="M18 8.5 11 15.5" />
                  </svg>
                </span>
                <span class="editor-action-label">Complete &amp; Next</span>
              </button>
              <button id="copyButton" class="editor-action-button" type="button">
                <span class="editor-action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="9" y="9" width="10" height="10" rx="2" />
                    <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
                  </svg>
                </span>
                <span class="editor-action-label">Copy This Design</span>
              </button>
              <button id="downloadButton" class="editor-action-button" type="button">
                <span class="editor-action-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M12 4v10M8.5 10.5 12 14l3.5-3.5" />
                    <path d="M5 16v1a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-1" />
                  </svg>
                </span>
                <span class="editor-action-label">Export This Design</span>
              </button>
            </div>
          </header>

          <div class="editor-body">
            <section class="editor-workspace">
              <section class="editor-main-column" aria-label="Design preview workspace">
                <section class="editor-top-card" aria-label="Order-level information">
                  <div class="editor-top-grid">
                    <section class="top-card-section top-card-reference" aria-label="Listing details">
                      <section id="listingReferenceCard" class="listing-reference-card is-hidden" aria-label="Imported Etsy listing reference">
                        <p id="listingReferenceTitle" class="listing-reference-title"></p>
                        <div class="listing-reference-meta">
                          <img id="listingReferenceImage" class="listing-reference-image" alt="">
                          <div class="listing-reference-details">
                            <div id="importedColorField" class="imported-color-field is-hidden" aria-live="polite">
                              <span class="imported-color-label">Color</span>
                              <span id="importedColorValue" class="imported-color-value"></span>
                            </div>
                            <div id="importedQuantityField" class="imported-color-field is-hidden" aria-live="polite">
                              <span class="imported-color-label">Quantity</span>
                              <span id="importedQuantityValue" class="imported-color-value"></span>
                            </div>
                          </div>
                        </div>
                      </section>
                    </section>

                    <section class="top-card-section top-card-text" aria-label="Design text">
                      <label class="field compact-field design-text-field">
                        <span>Design Text</span>
                        <textarea id="textInput" autocomplete="off" rows="3" placeholder="Enter one or more lines of text"></textarea>
                      </label>
                    </section>
                  </div>
                </section>

                <section class="preview-workspace" aria-label="Badge reel preview">
                  <div class="preview-header-row">
                    <h3 class="preview-title">Preview</h3>
                    <span class="preview-caption">Pinned while inspector scrolls</span>
                  </div>
                  <div class="preview-panel">
                    <svg id="preview" role="img" aria-label="Preview of overlapped badge reel text"></svg>
                  </div>
                  <div id="connectionStatus" class="status-card status-pending" aria-live="polite">
                    <span id="connectionStatusIndicator" class="order-analysis-indicator is-hidden" aria-hidden="true"></span>
                    <div class="status-card-copy">
                      <strong id="connectionStatusLabel">Connectedness pending</strong>
                      <span id="connectionStatusDetail">Enter text to analyze whether the face layer cuts as one acrylic piece.</span>
                    </div>
                  </div>
                </section>
              </section>

              <aside class="line-controls-rail" aria-label="Layout controls">
                <div class="layout-utility-row" aria-label="Layout utilities">
                  <button id="copyLayoutPlacementButton" class="editor-action-button editor-utility-button" type="button" disabled>
                    <span class="editor-action-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <rect x="9" y="9" width="10" height="10" rx="2" />
                        <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
                        <path d="M12 12h4M14 10v4" />
                      </svg>
                    </span>
                    <span class="editor-action-label">Copy Layout</span>
                  </button>
                  <button id="pasteLayoutPlacementButton" class="editor-action-button editor-utility-button" type="button" disabled>
                    <span class="editor-action-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M8 5.5h3l1-1h4a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-1.5" />
                        <path d="M8 4v5h5" />
                        <path d="M8 9 4 13m0 0h3m-3 0v-3" />
                      </svg>
                    </span>
                    <span class="editor-action-label">Paste Layout</span>
                  </button>
                </div>

                <section class="global-controls-panel" aria-label="Global controls">
                  <label class="field compact-field">
                    <span>Presets</span>
                    <select id="presetInput"></select>
                  </label>

                  <label class="check-field" for="weldExportedDesignInput">
                    <input id="weldExportedDesignInput" type="checkbox" checked>
                    <span>Weld Exported Design</span>
                  </label>

                  <label class="field compact-field">
                    <span>Horizontal Stretch</span>
                    <div class="range-row">
                      <input id="globalHorizontalScaleInput" type="range" min="0.75" max="2" step="0.01" value="1">
                      <output id="globalHorizontalScaleOutput">100%</output>
                    </div>
                  </label>

                  <label class="field compact-field">
                    <span>Vertical Stretch</span>
                    <div class="range-row">
                      <input id="globalVerticalScaleInput" type="range" min="0.75" max="1.5" step="0.01" value="1">
                      <output id="globalVerticalScaleOutput">100%</output>
                    </div>
                  </label>

                  <label class="field compact-field">
                    <span>Backing Border</span>
                    <div class="range-row">
                      <input id="backingInput" type="range" min="0" max="10" step="0.1" value="2.2">
                      <output id="backingOutput">2.200 mm</output>
                    </div>
                  </label>
                </section>

                <div id="lineControls" class="line-controls"></div>
              </aside>
            </section>
          </div>
        </section>
      </section>
    </main>

    <script src="src/app.js" type="module"></script>
  </body>
</html>
